apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mesh-edge
  namespace: istio-system
spec:
  ingressClassName: nginx
  rules:
    - host: "*.localtest.me"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: istio-ingressgateway
                port:
                  number: 80