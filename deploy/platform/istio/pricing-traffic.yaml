apiVersion: networking.istio.io/v1
kind: DestinationRule
metadata:
  name: pricing
  namespace: shop
spec:
  host: pricing.shop.svc.cluster.local
  subsets:
    - name: v1
      labels:
        version: v1
    - name: v2
      labels:
        version: v2
  trafficPolicy:
    connectionPool:
      tcp:
        maxConnections: 20
      http:
        http2MaxRequests: 100
        maxRequestsPerConnection: 0
    outlierDetection:
      consecutive5xxErrors: 3
      interval: 15s
      baseEjectionTime: 30s
      maxEjectionPercent: 50

---

apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: pricing
  namespace: shop
spec:
  hosts:
    - pricing.shop.svc.cluster.local
  http:
    - route:
        - destination:
            host: pricing.shop.svc.cluster.local
            subset: v1
            port:
              number: 50051
          weight: 90
        - destination:
            host: pricing.shop.svc.cluster.local
            subset: v2
            port:
              number: 50051
          weight: 10
      timeout: 1800ms
      retries:
        attempts: 2
        perTryTimeout: 500ms
        retryOn: cancelled,unavailable,connect-failure,refused-stream

---

apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: allow-order-api-to-pricing
  namespace: shop
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: pricing
  action: ALLOW
  rules:
    - from:
        - source:
            principals:
              - "cluster.local/ns/shop/sa/order-api"